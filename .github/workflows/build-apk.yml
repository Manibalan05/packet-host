name: Build APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # NOTE: ubuntu runners already ship the Android SDK. Do NOT use
      # android-actions/setup-android@v3 — it runs `sdkmanager tools`,
      # an obsolete package that fails with exit code 1.
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK (stable + versioned names)
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk packet-host.apk
          cp app/build/outputs/apk/debug/app-debug.apk "packet-host-${GITHUB_REF_NAME}.apk"
          ls -lh *.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packet-host.apk
            packet-host-${{ github.ref_name }}.apk
          generate_release_notes: true
