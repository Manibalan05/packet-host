---
name: Bug report
description: Report a reproducible Packet Host bug
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device + Android version
      placeholder: Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. + → Clone ... 2. Run → ... 3. Host → ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redact public URLs)
